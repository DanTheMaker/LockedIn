<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dan’s Action Memory</title>
<style>
:root{--bg:#f6f5f1;--ink:#17201b;--muted:#69716c;--card:#fff;--line:#e4e5df;--accent:#d8ff67;--dark:#17201b;--soft:#edf0e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:auto;padding:34px 24px 70px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-weight:850;letter-spacing:-.04em;font-size:22px}.sync{font-size:13px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6ebc48;margin-right:7px}.hero{background:var(--dark);color:#fff;border-radius:28px;padding:32px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#b8c0bb;font-weight:800}.hero h1{font-size:clamp(34px,5vw,64px);line-height:.98;letter-spacing:-.055em;margin:10px 0 28px}.focus-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.focus{background:#25302a;border:1px solid #344039;border-radius:18px;padding:18px}.focus b{display:block;font-size:18px;margin-top:5px}.focus .num{color:var(--accent);font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.stat strong{display:block;font-size:30px;letter-spacing:-.04em}.stat span{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:1.6fr .9fr;gap:24px}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px}.panel h2{font-size:20px;letter-spacing:-.03em;margin:0 0 18px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px;font-size:12px;cursor:pointer}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.action{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}.action:first-of-type{border-top:0}.check{width:20px;height:20px;border:1.5px solid #aeb5b0;border-radius:7px;margin-top:1px}.title{font-weight:700;font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}.pill.priority{background:var(--accent);color:#1b241f}.change{padding:12px 0;border-top:1px solid var(--line);font-size:13px}.change:first-of-type{border-top:0}.change time{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.empty{color:var(--muted);font-size:13px}.section-space{margin-top:24px}@media(max-width:760px){.focus-grid,.stats,.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;gap:12px}.hero{padding:24px}}
</style>
</head>
<body><main class="shell"><header><div class="brand">Dan’s Action Memory</div><div class="sync"><span class="dot"></span><span id="updated">Loading…</span></div></header><section class="hero"><div class="eyebrow">Tomorrow’s focus</div><h1>Make the important<br>things obvious.</h1><div class="focus-grid" id="focus"></div></section><section class="stats" id="stats"></section><div class="layout"><section class="panel"><h2>Action board</h2><div class="tabs" id="tabs"></div><div id="actions"></div></section><aside><section class="panel"><h2>What changed</h2><div id="changes"></div></section><section class="panel section-space"><h2>Decisions</h2><div id="decisions"></div></section><section class="panel section-space"><h2>Ideas to explore</h2><div id="ideas"></div></section></aside></div></main><script>
let data,filter='All';
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function render(){document.getElementById('updated').textContent='Synced '+data.updated;
const open=data.actions.filter(a=>a.status==='open'), pri=open.filter(a=>a.priority==='tomorrow');
document.getElementById('focus').innerHTML=pri.map((a,i)=>`<div class="focus"><span class="num">0${i+1}</span><b>${esc(a.title)}</b><div class="meta">${esc(a.category)}</div></div>`).join('');
const cats=['Arya Connect','Pudding','Personal','Other'];document.getElementById('stats').innerHTML=[['Open actions',open.length],['Tomorrow',pri.length],['Decisions',data.decisions.length],['Ideas',data.ideas.length]].map(([l,n])=>`<div class="stat"><strong>${n}</strong><span>${l}</span></div>`).join('');
const tabs=['All',...cats];document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${t===filter?'active':''}" onclick="filter='${t}';render()">${t}</button>`).join('');
const shown=open.filter(a=>filter==='All'||a.category===filter);document.getElementById('actions').innerHTML=shown.map(a=>`<div class="action"><span class="check"></span><div><div class="title">${esc(a.title)}</div><div class="meta">${esc(a.category)}${a.context?' · '+esc(a.context):''}</div></div><span class="pill ${a.priority==='tomorrow'?'priority':''}">${a.priority==='tomorrow'?'Tomorrow':'Open'}</span></div>`).join('')||'<div class="empty">Nothing here.</div>';
document.getElementById('changes').innerHTML=data.changes.map(c=>`<div class="change"><time>${esc(c.date)}</time>${esc(c.text)}</div>`).join('')||'<div class="empty">No changes yet.</div>';
document.getElementById('decisions').innerHTML=data.decisions.map(x=>`<div class="change">${esc(x)}</div>`).join('')||'<div class="empty">No explicit decisions captured.</div>';
document.getElementById('ideas').innerHTML=data.ideas.map(x=>`<div class="change">${esc(x)}</div>`).join('')||'<div class="empty">No ideas parked.</div>'}
fetch('./actions.json?ts='+Date.now()).then(r=>r.json()).then(d=>{data=d;render()}).catch(()=>document.getElementById('updated').textContent='Could not load actions.json');
</script></body></html>
